name: tkoc

services:
  web:
    image: tkoc-modern:local
    build:
      context: .
      target: runner
    container_name: tkoc-web
    env_file:
      - ../appdata/tkoc-modern/.env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3400"
    network_mode: host
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3400/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  tick:
    image: tkoc-modern:local
    container_name: tkoc-tick
    command: ["node", "scripts/tick-worker.mjs"]
    env_file:
      - ../appdata/tkoc-modern/.env.production
    environment:
      PORT: "3400"
      TICK_ENDPOINT: http://127.0.0.1:3400/api/cron/tick
    network_mode: host
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    profiles: ["tools"]
    image: tkoc-modern-migrator:local
    build:
      context: .
      target: migrator
    env_file:
      - ../appdata/tkoc-modern/.env.production
    network_mode: host
