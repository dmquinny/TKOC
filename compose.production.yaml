name: tkoc

services:
  web:
    image: tkoc-modern:local
    build:
      context: .
      target: runner
    container_name: tkoc-web
    env_file:
      - ../appdata/tkoc-modern/.env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3400"
    # Wait for MySQL before starting Next.js. tkoc_db is in the root compose
    # file, so depends_on cannot order the two, and after a reboot Docker starts
    # both at once. If web wins that race its database pool is left empty and
    # never recovers: the game stopped ticking for 24 hours after the 18 Sep
    # 2026 reboot. MySQL only sends its greeting once it is ready for
    # connections, so wait for that rather than just an open port.
    command:
      - sh
      - -c
      - |
        until node -e '
          const url = new URL(process.env.DATABASE_URL);
          const socket = require("net").connect(Number(url.port) || 3306, url.hostname);
          socket.setTimeout(3000);
          socket.once("data", () => process.exit(0));
          socket.once("error", () => process.exit(1));
          socket.once("timeout", () => process.exit(1));
        '; do
          echo "Waiting for MySQL to accept connections..."
          sleep 2
        done
        exec node server.js
    network_mode: host
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3400/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  tick:
    image: tkoc-modern:local
    container_name: tkoc-tick
    command: ["node", "scripts/tick-worker.mjs"]
    env_file:
      - ../appdata/tkoc-modern/.env.production
    environment:
      PORT: "3400"
      TICK_ENDPOINT: http://127.0.0.1:3400/api/cron/tick
    network_mode: host
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    profiles: ["tools"]
    image: tkoc-modern-migrator:local
    build:
      context: .
      target: migrator
    env_file:
      - ../appdata/tkoc-modern/.env.production
    network_mode: host

